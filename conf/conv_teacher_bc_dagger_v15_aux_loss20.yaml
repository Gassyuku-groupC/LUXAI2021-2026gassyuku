defaults:
  - conv_teacher_bc_dagger_v13b_best_anchor
  - _self_

name: conv_teacher_bc_dagger_v15_aux_loss20
group: local_teacher_bc_dagger_v15_aux_loss20

# Conservative next stage:
# - keep the current best as teacher anchor with KL/BC protection
# - keep Actor decisions driven by the original policy/RL objectives
# - add loss20 only as an auxiliary representation-learning task
use_aux_risk: true
aux_risk_cost: 0.05
aux_risk_horizon: 20
aux_risk_hidden_channels: 128
aux_risk_dropout: 0.10
aux_risk_pos_weight_scale: 1.0
aux_risk_threshold: 0.40

# Start small; the wrapper can override this with 32/64+ games.
total_games: 16
total_steps: 6400

hydra:
  run:
    dir: outputs/teacher_bc_dagger_v15_aux_loss20/${now:%Y-%m-%d_%H-%M-%S}
