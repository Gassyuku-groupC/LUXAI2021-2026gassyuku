defaults:
  - conv_teacher_bc_dagger_v10_shadow
  - _self_

name: conv_teacher_bc_dagger_v11_stability
group: local_teacher_bc_dagger_stability

# Research branch after V10. Keep the proven V10 reward structure mostly intact:
# the failed pre-match tune made endgame penalties too sharp and caused a
# catastrophic night-loss spike. This version adds gentle shaping instead.
reward_space_kwargs:
  small_map_research: 0.04
  midgame_start_turn: 80
  midgame_end_turn: 180
  midgame_ramp_turns: 20
  midgame_buffer_health: 0.15

hydra:
  run:
    dir: outputs/teacher_bc_dagger_v11_stability/${now:%Y-%m-%d_%H-%M-%S}
