defaults:
  - conv_teacher_bc_dagger_v13_rl_adapt_from_best
  - _self_

name: conv_teacher_bc_dagger_v13b_best_anchor
group: local_teacher_bc_dagger_v13b_best_anchor

# Anchor the learner to the current production best during RL continuation.
# The v13 stage-16 candidate moved too far from best and produced large side
# gaps, so v13b makes policy drift expensive before increasing game count.
use_teacher: true
teacher_load_dir: D:/Luxai/Kaggle_Lux_AI_2021/outputs/auto_league_dagger_v10_shadow/best_agent/lux_ai/rl_agent
teacher_checkpoint_file: candidate_weights.pt
teacher_kl_cost: 0.01
teacher_baseline_cost: 0.0
teacher_bc_cost_start: 1.5
teacher_bc_cost_end: 0.75
teacher_bc_anneal_games: 500
teacher_bc_worker_weight: 1.0
teacher_bc_city_tile_weight: 1.0
teacher_bc_cart_weight: 1.0

# Keep RL active, but make the shaped-reward update less able to wipe out the
# current best agent's scale and timing.
rl_policy_cost: 0.5
policy_advantage_clip: 5.0

reward_space_kwargs:
  research_late_scale: 0.10
  small_map_research: 0.0

  strategy_buffer_start_turn: 120
  strategy_buffer_mid_turn: 160
  strategy_buffer_late_turn: 240
  min_buffer_target_early: 8.0
  min_buffer_target_mid: 10.0
  p25_buffer_target_mid: 15.0
  p25_buffer_target_late: 20.0

  strategy_min_buffer: 0.45
  strategy_p25_buffer: 0.35

  buffer_drop_with_growth: 8.0
  buffer_growth_drop_threshold: 3.0
  buffer_growth_drop_clip: 10.0

  risk_adjusted_size_start_turn: 120
  risk_adjusted_city_gain: 0.35
  risk_adjusted_unit_gain: 0.06
  risk_adjusted_size_buffer_blend: 0.60

total_games: 16
total_steps: 6400

hydra:
  run:
    dir: outputs/teacher_bc_dagger_v13b_best_anchor/${now:%Y-%m-%d_%H-%M-%S}
