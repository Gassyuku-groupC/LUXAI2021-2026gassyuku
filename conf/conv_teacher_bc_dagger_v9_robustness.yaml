defaults:
  - conv_teacher_bc_dagger_v8_generalization
  - _self_

name: conv_teacher_bc_dagger_v9_robustness
group: local_teacher_bc_dagger_robustness

reward_space_kwargs:
  # Remove V8's persistent small-map research progress reward.
  small_map_research: 0.0

  # One-shot shortfall penalties. They fire only when the deadline is crossed.
  small_map_coal_deadline: 10.0
  small_map_uranium_deadline: 20.0
  research_coal_deadline_turn: 80
  research_uranium_deadline_turn: 200

  # Penalize only a newly created city's own next-night fuel shortfall. The
  # second term smoothly adds pressure during the vulnerable turn 60-120 span.
  unsafe_new_city: 12.0
  midgame_unsafe_new_city: 8.0
  unsafe_new_city_start_turn: 60
  unsafe_new_city_end_turn: 120
  unsafe_new_city_ramp_turns: 10

# Preserve raw joint log-probs for V-trace ratios, but normalize the policy
# gradient log-prob per time/player by the number of actions actually taken.
normalize_policy_log_probs_by_actions: true

total_games: 16
total_steps: 6400

hydra:
  run:
    dir: outputs/teacher_bc_dagger_v9_robustness/${now:%Y-%m-%d_%H-%M-%S}
