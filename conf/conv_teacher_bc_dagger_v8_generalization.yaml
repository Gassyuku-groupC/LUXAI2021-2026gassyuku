defaults:
  - conv_teacher_bc_dagger_v7_16x16
  - _self_

name: conv_teacher_bc_dagger_v8_generalization
group: local_teacher_bc_dagger_generalization

# Stage 400 remains an immutable 16x16 baseline. V8 starts from a copy of its
# weights and writes to a separate league directory.
env_configuration:
  trainingMapSizes: [12, 16, 24, 32]
  trainingMapSampling: balanced_cycle
  mapType: random
  loglevel: 0

training_spatial_augmentation: true
training_player_swap_probability: 0.5

reward_space_kwargs:
  # Extra progress signal only on 12x12 and 16x16, and only until uranium.
  small_map_research: 0.12

total_games: 16
total_steps: 6400

hydra:
  run:
    dir: outputs/teacher_bc_dagger_v8_generalization/${now:%Y-%m-%d_%H-%M-%S}
