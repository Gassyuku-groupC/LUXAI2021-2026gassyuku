defaults:
  - conv_teacher_bc_dagger_v4_16x16
  - _self_

name: conv_teacher_bc_dagger_v6_16x16

# Restore the v4 reward. In particular, do not add a persistent positive
# midgame fuel-health reward.
reward_space_kwargs:
  midgame_buffer_health: 0.0

# Preserve raw advantage ordering while bounding pathological samples. Sum
# losses are normalized over time, batch, and both players inside monobeast.
normalize_policy_advantages: false
policy_advantage_clip: 10.0
normalize_actor_critic_losses: true

hydra:
  run:
    dir: outputs/teacher_bc_dagger_v6_16x16/${now:%Y-%m-%d_%H-%M-%S}
