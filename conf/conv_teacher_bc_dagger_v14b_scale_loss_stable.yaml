defaults:
  - conv_teacher_bc_dagger_v14_scale_loss_balance
  - _self_

name: conv_teacher_bc_dagger_v14b_scale_loss_stable
group: local_teacher_bc_dagger_v14b_scale_loss_stable

# V14 found a useful scale signal by stage 48, then drifted badly by stage 64.
# V14b keeps the same objective, but slows policy movement and makes the best
# agent anchor stronger for longer runs.
optimizer_kwargs:
  lr: 1e-6
  eps: 0.0003

teacher_kl_cost: 0.02
teacher_bc_cost_start: 2.0
teacher_bc_cost_end: 1.0
teacher_bc_anneal_games: 1500
rl_policy_cost: 0.45
policy_advantage_clip: 3.0

reward_space_kwargs:
  research_late_scale: 0.10
  small_map_research: 0.0

  city_gain: 0.7
  city_loss: 18.0
  unit: 0.16

  strategy_buffer_start_turn: 120
  strategy_buffer_mid_turn: 160
  strategy_buffer_late_turn: 240
  min_buffer_target_early: 8.0
  min_buffer_target_mid: 10.0
  p25_buffer_target_mid: 15.0
  p25_buffer_target_late: 20.0

  strategy_min_buffer: 0.50
  strategy_p25_buffer: 0.40

  risk_adjusted_size_start_turn: 120
  risk_adjusted_city_gain: 0.35
  risk_adjusted_unit_gain: 0.06
  risk_adjusted_size_buffer_blend: 0.65

  scale_target_start_turn: 120
  scale_target_mid_turn: 160
  scale_target_late_turn: 240
  scale_target_early_density: 0.04
  scale_target_mid_density: 0.10
  scale_target_late_density: 0.18
  scale_target_end_density: 0.22
  scale_target_bonus: 0.14
  scale_target_shortfall: 0.28
  safe_scale_target_bonus: 0.18

  buffer_drop_with_growth: 12.0
  buffer_growth_drop_threshold: 3.0
  buffer_growth_drop_clip: 8.0

total_games: 16
total_steps: 6400

hydra:
  run:
    dir: outputs/teacher_bc_dagger_v14b_scale_loss_stable/${now:%Y-%m-%d_%H-%M-%S}
