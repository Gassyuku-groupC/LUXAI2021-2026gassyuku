defaults:
  - conv_config
  - _self_

name: conv_teacher_bc_dagger_v20_win_scale_gate
group: local_teacher_bc_dagger_v20_win_scale_gate

# V20 changes the objective from "minimize all city loss" to "win with enough
# final scale while guarding only catastrophic loss". The teacher anchor keeps
# the current best policy from drifting too far during RL continuation.
reward_space: WinScaleCatastrophicGuardReward

num_actors: 1
n_actor_envs: 2
batch_size: 2
optimizer_kwargs:
  lr: 3.0e-06
  eps: 0.0003
entropy_cost: 2.0e-05
reduction: sum
disable_wandb: true
actor_device: cuda:0
learner_device: cuda:0
model_log_freq: 1000
sharing_strategy: file_system
use_mixed_precision: true
checkpoint_freq: 10000
num_learner_threads: 1
load_dir: null
checkpoint_file: null
weights_only: false
n_value_warmup_batches: 0

env_configuration:
  width: 16
  height: 16
  loglevel: 0
  trainingMapSizes:
    - 12
    - 16
    - 24
    - 32

use_teacher: true
teacher_load_dir: D:/Luxai/Kaggle_Lux_AI_2021/outputs/auto_league_dagger_v10_shadow/best_agent/lux_ai/rl_agent
teacher_checkpoint_file: candidate_weights.pt
teacher_kl_cost: 0.018
teacher_baseline_cost: 0.0
teacher_bc_cost_start: 1.50
teacher_bc_cost_end: 0.70
teacher_bc_anneal_games: 1200
teacher_bc_game_offset: 0
teacher_bc_worker_weight: 1.0
teacher_bc_city_tile_weight: 1.0
teacher_bc_cart_weight: 1.0
rl_policy_cost: 0.40
normalize_actor_critic_losses: true
normalize_policy_log_probs_by_actions: true
training_spatial_augmentation: true
training_player_swap_probability: 0.5
training_player_swap_per_sample: true
policy_advantage_clip: 3.0

# Enable the same shared runtime gate during monobeast rollout. Deployment also
# calls the same RuntimeGatePolicy through RLAgent.resolve_collision_detection.
runtime_gate_v1_enabled: true
runtime_gate_v1_late_turn: 160
runtime_gate_v1_pre_night_turns: 3
runtime_gate_v1_min_city_fuel_turns_block_bw: 3.0
runtime_gate_v1_p25_city_fuel_turns_block_bw: 8.0
runtime_gate_v1_total_fuel_turns_block_bw: 5.0
runtime_gate_v1_min_city_fuel_turns_block_bcity: 2.5
runtime_gate_v1_p25_city_fuel_turns_block_bcity: 6.0
runtime_gate_v1_total_fuel_turns_block_bcity: 4.0
runtime_gate_v1_large_map_extra_strict: true
runtime_gate_v1_large_map_size: 32
runtime_gate_v1_large_map_min_city_tiles: 40
runtime_gate_v1_large_map_p25_city_fuel_turns_block_bw: 12.0
runtime_gate_v1_large_map_p25_city_fuel_turns_block_bcity: 10.0

use_aux_risk: true
aux_risk_cost: 0.010
aux_risk_horizon: 20
aux_risk_hidden_channels: 128
aux_risk_dropout: 0.10
aux_risk_pos_weight_scale: 0.75
aux_risk_threshold: 0.40

reward_space_kwargs:
  positive_weight: 1.0
  negative_weight: 1.20
  reward_scale: 500.0

  # Main match objective.
  result: 95.0
  final_city_margin: 2.2
  final_unit_margin: 0.55

  # Low-amplitude shaping: enough to keep learning dense, not enough to force
  # a timid survival-only policy.
  city_gain: 0.08
  unit_gain: 0.035

  # Only penalize large harmful losses. Small city churn is allowed when final
  # scale/win outcome remains strong.
  catastrophic_loss_threshold: 4.0
  catastrophic_city_loss: 10.0
  losing_loss_multiplier: 2.0

  # Soft scale objective. Scale is rewarded only when fuel buffer is acceptable.
  scale_target_start_turn: 120
  scale_target_mid_turn: 200
  scale_target_late_turn: 300
  scale_target_early_density: 0.04
  scale_target_mid_density: 0.10
  scale_target_late_density: 0.16
  scale_shortfall: 0.18
  safe_scale_bonus: 0.22
  safe_scale_min_buffer: 6.0
  safe_scale_p25_buffer: 10.0

  # Keep the late-game guard narrow: huge cities with very low fuel are bad,
  # especially because they often cause terminal collapse.
  unsafe_large_city_start_turn: 240
  unsafe_large_city_late_turn: 320
  unsafe_large_city_min_tiles: 18
  unsafe_large_city_target_turns: 12.0
  unsafe_large_city_late_target_turns: 22.0
  unsafe_large_city: 4.0

  # Penalize growth that sharply reduces aggregate fuel turns.
  buffer_drop_with_growth: 8.0
  buffer_growth_drop_threshold: 4.0
  buffer_growth_drop_clip: 16.0

total_games: 16
total_steps: 6400

hydra:
  run:
    dir: outputs/teacher_bc_dagger_v20_win_scale_gate/${now:%Y-%m-%d_%H-%M-%S}
