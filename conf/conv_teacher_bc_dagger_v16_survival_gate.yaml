defaults:
  - conv_teacher_bc_dagger_v13b_best_anchor
  - _self_

name: conv_teacher_bc_dagger_v16_survival_gate
group: local_teacher_bc_dagger_v16_survival_gate

# V16 teaches the expansion/survival tradeoff directly:
# - expansion is rewarded only when both min and p25 city fuel buffers are healthy
# - late-game low-buffer expansion is strongly penalized
# - scale targets are reduced so the agent is not pushed toward 50+ tiles on 16x16
# - auxiliary risk is kept as a weak representation task, not as a policy driver
teacher_kl_cost: 0.015
teacher_bc_cost_start: 1.25
teacher_bc_cost_end: 0.50
teacher_bc_anneal_games: 800
rl_policy_cost: 0.45
policy_advantage_clip: 3.0

use_aux_risk: true
aux_risk_cost: 0.015
aux_risk_horizon: 20
aux_risk_hidden_channels: 128
aux_risk_dropout: 0.10
aux_risk_pos_weight_scale: 1.0
aux_risk_threshold: 0.40

reward_space_kwargs:
  research_late_scale: 0.10
  small_map_research: 0.0

  city_gain: 0.35
  city_loss: 24.0
  unit: 0.12

  endgame_start_turn: 300
  fuel_deficit_clip: 12.0
  endgame_buffer_deficit: 1.25
  late_expansion: 32.0

  strategy_buffer_start_turn: 100
  strategy_buffer_mid_turn: 150
  strategy_buffer_late_turn: 230
  min_buffer_target_early: 9.0
  min_buffer_target_mid: 12.0
  p25_buffer_target_mid: 18.0
  p25_buffer_target_late: 28.0

  strategy_min_buffer: 0.75
  strategy_p25_buffer: 0.75

  risk_adjusted_size_start_turn: 100
  risk_adjusted_city_gain: 0.22
  risk_adjusted_unit_gain: 0.04
  risk_adjusted_size_buffer_blend: 0.85

  scale_target_start_turn: 140
  scale_target_mid_turn: 180
  scale_target_late_turn: 260
  scale_target_early_density: 0.035
  scale_target_mid_density: 0.075
  scale_target_late_density: 0.12
  scale_target_end_density: 0.14
  scale_target_bonus: 0.05
  scale_target_shortfall: 0.04
  safe_scale_target_bonus: 0.06

  unsafe_new_city: 18.0
  midgame_unsafe_new_city: 12.0
  unsafe_new_city_start_turn: 50
  unsafe_new_city_end_turn: 150
  unsafe_new_city_ramp_turns: 15

  unsafe_large_city_start_turn: 220
  unsafe_large_city_late_turn: 300
  unsafe_large_city_min_tiles: 12
  unsafe_large_city_target_turns: 18.0
  unsafe_large_city_late_target_turns: 32.0
  unsafe_large_city: 8.0

  buffer_gain: 0.12
  buffer_deficit: 0.65
  unsafe_expansion: 22.0
  buffer_drop_with_growth: 28.0
  buffer_growth_drop_threshold: 1.0
  buffer_growth_drop_clip: 6.0

total_games: 16
total_steps: 6400

hydra:
  run:
    dir: outputs/teacher_bc_dagger_v16_survival_gate/${now:%Y-%m-%d_%H-%M-%S}
