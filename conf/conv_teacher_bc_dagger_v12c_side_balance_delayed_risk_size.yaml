defaults:
  - conv_teacher_bc_dagger_v12_strategy_buffer
  - _self_

name: conv_teacher_bc_dagger_v12c_side_balance_delayed_risk_size
group: local_teacher_bc_dagger_v12c_side_balance_delayed_risk_size

# Keep side augmentation, but avoid an early-game scale push before the first
# meaningful fuel-buffer targets are active.
training_player_swap_probability: 0.5
training_player_swap_per_sample: true

reward_space_kwargs:
  city_gain: 1.0
  unit: 0.18
  risk_adjusted_size_start_turn: 120
  risk_adjusted_city_gain: 0.70
  risk_adjusted_unit_gain: 0.12
  risk_adjusted_size_buffer_blend: 0.60

total_games: 16
total_steps: 6400

hydra:
  run:
    dir: outputs/teacher_bc_dagger_v12c_side_balance_delayed_risk_size/${now:%Y-%m-%d_%H-%M-%S}
